<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2A154" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d645b" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  
  <!-- Simple van illustration -->
  <g transform="translate(50, 75)">
    <!-- Van body -->
    <rect x="0" y="0" width="100" height="50" rx="5" fill="url(#vanGradient)" />
    
    <!-- Window -->
    <rect x="10" y="10" width="35" height="22" rx="3" fill="#E0F2FE" opacity="0.9" />
    
    <!-- Wheels -->
    <circle cx="20" cy="50" r="8" fill="#0d645b" opacity="0.6" />
    <circle cx="80" cy="50" r="8" fill="#0d645b" opacity="0.6" />
  </g>
</svg>
